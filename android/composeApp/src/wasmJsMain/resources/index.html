<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKIL Lifestyle - Single-Source E-Commerce App</title>
    <link rel="icon" type="image/x-icon" href="https://res.cloudinary.com/aiz2tooi/image/upload/f_auto,q_auto,w_32,h_32/v1784722804/SKIL_Lifestyle_Black_Transparent_BG_Logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script type="application/javascript" src="skiko.js"></script>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #f4f5f8;
            overflow: hidden;
        }
        #ComposeTarget {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <canvas id="ComposeTarget"></canvas>
    <script type="application/javascript">
        // 120Hz Fluid WASM Web Scrolling: Non-recursive native WheelEvent getter interception
        window.addEventListener('wheel', function(e) {
            if (!e._skilAmplified) {
                Object.defineProperty(e, '_skilAmplified', { value: true, writable: false });
                const originalY = e.deltaY;
                const originalX = e.deltaX;
                Object.defineProperty(e, 'deltaY', { get: () => originalY * 3.2 });
                Object.defineProperty(e, 'deltaX', { get: () => originalX * 3.2 });
            }
        }, { capture: true, passive: true });
    </script>
    <script type="application/javascript" src="skilApp.js"></script>
</body>
</html>
