<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKIL Lifestyle - Single-Source E-Commerce App</title>
    <link rel="icon" type="image/x-icon" href="https://res.cloudinary.com/aiz2tooi/image/upload/f_auto,q_auto,w_32,h_32/v1784722804/SKIL_Lifestyle_Black_Transparent_BG_Logo.png">
    <script type="application/javascript" src="skiko.js"></script>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #f4f5f8;
            overflow: hidden;
        }
        #ComposeTarget {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <canvas id="ComposeTarget"></canvas>
    <script type="application/javascript" src="skilApp.js"></script>
    <script>
        // Amplify mouse wheel scroll sensitivity for Compose WASM canvas (3x multiplier)
        (function() {
            var _amplifying = false;
            document.getElementById('ComposeTarget').addEventListener('wheel', function(e) {
                if (_amplifying) return;
                e.stopPropagation();
                e.preventDefault();
                _amplifying = true;
                var amplified = new WheelEvent('wheel', {
                    deltaX: e.deltaX * 3,
                    deltaY: e.deltaY * 3,
                    deltaZ: e.deltaZ,
                    deltaMode: e.deltaMode,
                    clientX: e.clientX,
                    clientY: e.clientY,
                    screenX: e.screenX,
                    screenY: e.screenY,
                    ctrlKey: e.ctrlKey,
                    shiftKey: e.shiftKey,
                    altKey: e.altKey,
                    metaKey: e.metaKey,
                    bubbles: true,
                    cancelable: true
                });
                e.target.dispatchEvent(amplified);
                _amplifying = false;
            }, { capture: true, passive: false });
        })();
    </script>
</body>
</html>
